<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buffon Fragrâncias</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo">
            <h1>BUFFON</h1>
            <p>FRAGRÂNCIAS</p>
        </div>
        
        <!-- 1. Container de status com a correção aplicada -->
        <div class="status-container">
            <span class="status-item"><span class="dot green"></span> dados salvos neste navegador</span>
            <span class="status-item"><span class="dot blue"></span> atualizado da nuvem</span>
            <!-- A bolinha cinza agora terá o texto visível sem quebrar o layout -->
            <span class="status-item"><span class="dot gray"></span> backup automático desativado</span>
        </div>
    </header>

    <main>
        <section class="nova-venda">
            <h2>NOVA VENDA</h2>
            <form>
                <div class="grid-form">
                    <!-- 2. Campo de data corrigido -->
                    <div class="form-group">
                        <label>Data</label>
                        <input type="date" value="2026-08-31">
                    </div>
                    <div class="form-group">
                        <label>Qtde</label>
                        <input type="number" value="1">
                    </div>
                </div>
            </form>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
