name: Fix perfume tips bubble v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-feature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix floating bubble visibility
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = "  const qs=new URLSearchParams(location.search);\n  if(!qs.get('c') && !qs.get('p')) return;\n"
          if old in text:
              text = text.replace(old, '', 1)
              path.write_text(text, encoding='utf-8')
              print('Visibility condition removed.')
          elif '<!-- BUFFON_PERFUME_TIPS_V1 -->' in text:
              print('Bubble block exists and condition is already absent.')
          else:
              raise SystemExit('Perfume tips block not found')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- index.html; then
            echo 'No index.html changes needed.'
          else
            git add index.html
            git commit -m 'fix: show perfume tips bubble on all catalog pages'
            git push
          fi
      - name: Remove installer workflow
        if: ${{ always() }}
        run: |
          git rm -f .github/workflows/fix-perfume-tips-v2.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: remove perfume tips installer'
            git push
          fi
