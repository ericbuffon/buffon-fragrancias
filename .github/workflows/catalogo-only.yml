name: Show perfume tips only in catalogo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/catalogo-only.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Restrict perfume tips to catalogo
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = "  const close=document.getElementById('buffonPerfumeTipsClose');\n"
          insert = marker + "  const isCatalogo=location.pathname==='/catalogo' || location.pathname.startsWith('/catalogo/');\n  if(!isCatalogo){btn.style.display='none';modal.remove();return;}\n"
          if "const isCatalogo=location.pathname==='/catalogo'" not in s:
              if marker not in s:
                  raise SystemExit('Marker not found')
              s = s.replace(marker, insert, 1)
              p.write_text(s, encoding='utf-8')
          else:
              print('Patch already present')
          PY

      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m "fix: show perfume tips only in catalogo"
          git push origin main