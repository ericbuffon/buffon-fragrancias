name: Fix perfume tips visibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/catalogo-only-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Fix visibility for public catalog only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "  const isCatalogo=location.pathname==='/catalogo' || location.pathname.startsWith('/catalogo/');\n  if(!isCatalogo){btn.style.display='none';modal.remove();return;}\n"
          new = "  const qs=new URLSearchParams(location.search);\n  const isCatalogo=!!(qs.get('c') || qs.get('p')) && (qs.get('c') || '').startsWith('cat_') || !!qs.get('p');\n  if(!isCatalogo){btn.style.display='none';modal.remove();return;}\n"
          if old in s:
              s = s.replace(old, new, 1)
          elif "const isCatalogo=" in s:
              import re
              s = re.sub(r"  const isCatalogo=.*?;\n  if\(!isCatalogo\)\{btn\.style\.display='none';modal\.remove\(\);return;\}\n", new, s, count=1)
          else:
              raise SystemExit('Catalog visibility block not found')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m "fix: show perfume tips only in public catalog"
          git push origin main

      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/catalogo-only-v2.yml || true
          git commit -m "chore: remove temporary catalog fix workflow" || true
          git push origin main || true
