name: Patch catalogo tips
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar alteração
        run: echo ''''BASE64_SCRIPT'''' | base64 --decode | python3
      - name: Commitar alteração
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: adicionar dicas ao catálogo público"
          git push